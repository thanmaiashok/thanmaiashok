<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070d"/><stop offset=".55" stop-color="#0f1330"/><stop offset="1" stop-color="#05070d"/></linearGradient>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset=".5" stop-color="#bc8cff"/><stop offset="1" stop-color="#ff7a3d"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#58a6ff" stroke-opacity=".10"/></pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58a6ff" stop-opacity="0"/><stop offset=".5" stop-color="#58a6ff" stop-opacity=".18"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient>
    <style>
      .n{font:800 68px 'Segoe UI',Helvetica,Arial,sans-serif;fill:url(#g);letter-spacing:2px;animation:in 1s ease-out backwards}
      .r{font:600 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3;animation:in 1s .35s ease-out backwards}
      .f{font:500 16px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e;letter-spacing:3px;animation:in 1s .7s ease-out backwards}
      .tag{font:700 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#ff7a3d;animation:in 1s 1s ease-out backwards}
      @keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
      .sc{animation:sweep 5s linear infinite}@keyframes sweep{from{transform:translateY(-60px)}to{transform:translateY(300px)}}
      .ring{transform-origin:850px 150px;animation:spin 18s linear infinite}
      .ring2{transform-origin:850px 150px;animation:spin 26s linear infinite reverse}
      @keyframes spin{to{transform:rotate(360deg)}}
      .node{animation:blink 2.4s ease-in-out infinite}
      @keyframes blink{50%{opacity:.25}}
    </style>
  </defs>
  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#grid)"/>
  <rect class="sc" width="1000" height="60" fill="url(#scan)"/>
  <g fill="none" stroke="url(#g)" stroke-width="1.5">
    <circle class="ring" cx="850" cy="150" r="95" stroke-dasharray="6 10"/>
    <circle class="ring2" cx="850" cy="150" r="65" stroke-dasharray="2 8"/>
    <circle cx="850" cy="150" r="34" stroke-opacity=".8"/>
  </g>
  <g fill="#58a6ff"><circle class="node" cx="850" cy="55" r="4"/><circle class="node" cx="945" cy="150" r="4" style="animation-delay:.6s"/><circle class="node" cx="850" cy="245" r="4" style="animation-delay:1.2s"/><circle class="node" cx="755" cy="150" r="4" style="animation-delay:1.8s"/></g>
  <text x="850" y="157" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#e6edf3">F</text>
  <text class="n" x="70" y="130">THANMAI A</text>
  <text class="r" x="72" y="175">AI / ML Engineer · Researcher · Builder</text>
  <text class="f" x="72" y="212">RAG  ·  MODEL OPTIMIZATION  ·  VISION</text>
  <text class="tag" x="72" y="255">▍ @ FoxynAI</text>
</svg>
