y and ResNet101</text><text x="116" y="102" font-size="13" fill="#cfcfcf" font-family="'DejaVu Sans Mono',Consolas,'Courier New',monospace">SR Sreeram, N Subash, N Nithya, Mohit Patil, A Thanmai</text><text x="116" y="126" font-size="13" fill="#aaaaaa" font-style="italic" font-family="'DejaVu Sans Mono',Consolas,'Courier New',monospace">2025 IEEE 17th International Conference on Computational Intelligence and Communication</text><text x="116" y="146" font-size="13" fill="#aaaaaa" font-style="italic" font-family="'DejaVu Sans Mono',Consolas,'Courier New',monospace">Networks (CICN)</text><text x="116" y="174" font-size="13" fill="#ffaa00" font-family="'DejaVu Sans Mono',Consolas,'Courier New',monospace">Published 2025/12/20  |  Pages 1394-1400  |  IEEE</text><text x="116" y="200" font-size="13" fill="#5555ff" font-family="'DejaVu Sans Mono',Consolas,'Courier New',monospace">+ ResNet101 fine-tuned to classify breast ultrasound images: benign, malignant or normal</text><text x="116" y="220" font-size="13" fill="#5555ff" font-family="'DejaVu Sans Mono',Consolas,'Courier New',monospace">+ Image augmentation and rebalancing to handle small, imbalanced data</text><text x="116" y="240" font-size="13" fill="#5555ff" font-family="'DejaVu Sans Mono',Consolas,'Courier New',monospace">+ Grad-CAM explainability shows what the model is looking at</text><text x="876" y="262" font-size="13" fill="#ff55ff" text-anchor="end" font-family="'DejaVu Sans Mono',Consolas,'Courier New',monospace">Enchanted: Peer Reviewed</text></svg>