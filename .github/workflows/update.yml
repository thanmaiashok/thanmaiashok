name: Update profile assets
on:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/update.yml"]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build contribution blocks
        run: python3 scripts/contrib.py "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/v5-contrib.svg
          git diff --cached --quiet || git commit -m "Update contribution blocks"
          git push
